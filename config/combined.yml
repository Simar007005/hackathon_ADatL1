# Same as baseline.yml, but train on both zero-bias runs.
# `root` is the folder containing the dataset's data/ directory, relative to the repo root.
# The default "." means ./data/<sample>/. Point it at a shared copy of the dataset if there is one.
root: .

# Anomaly detection is unsupervised: train and validate on normal data only.
# Each entry is [sample, split]. Only the zero-bias samples have a "train" split.
train:
- [ZB_run396102, train]
- [ZB_run398183, train]
val:
- [ZB_run396102, valid]
- [ZB_run398183, valid]

# Evaluation: background (normal data) vs. each signal separately.
test:
  background:
  - [ZB_run396102, test]
  signals:
  - [GluGluHto2Tau_Par-MH-125, test]
  - [WtoTauto3Mu, test]
  - [SUSYGluGluToBBHTo2B_Par-M-1200, test]
  - [haa-4b-ma15, test]

# Maximum number of events read per [sample, split] entry (null = everything).
max_events:
  train: 500000  # per run
  val: 200000
  test: 200000

# Input scaling, per feature. Which objects and features go into the model is chosen in
# train.ipynb (LAYOUT / FEATURES). Applied to real objects only (padding stays 0):
#   x -> (x - mean) / std, after Et -> log(1 + Et) if log_et is true.
# Values estimated from zero-bias data.
scaling:
  log_et: true
  mean: {Et: 1.86, eta: 0.0, phi: 3.14}
  std: {Et: 0.63, eta: 1.29, phi: 1.81}
